<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spice, herb &amp; aromatic pairing network</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --spice: #d9822b; --herb: #3f9b4a; --aromatic: #8b5fc7; --ink: #1f2328; --muted: #656d76; --line: #d0d7de; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); display: grid;
         grid-template-rows: auto 1fr auto; grid-template-columns: 1fr minmax(280px, 34%); height: 100vh; }
  header { grid-column: 1 / 3; padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 18px;
           align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  input[type=number] { width: 64px; }
  #cy { min-height: 0; background: #fbfbfc; }
  aside { border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px; }
  aside h2 { font-size: 15px; margin: 4px 0 8px; }
  aside h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  footer { grid-column: 1 / 3; border-top: 1px solid var(--line); padding: 6px 16px; color: var(--muted); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.pair { cursor: pointer; } tr.pair:hover { background: #f3f6fa; }
  .tag { font-size: 11px; padding: 0 5px; border-radius: 8px; background: #eee; color: #444; white-space: nowrap; }
  .tag.sparse { background: #fff1c2; } .tag.neg { background: #f6d6d6; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }
  .muted { color: var(--muted); } .warn { background: #fff8e1; border: 1px solid #f0d98c; padding: 6px 8px; border-radius: 6px; }
  button { cursor: pointer; }
  ul { padding-left: 18px; margin: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>Spice, herb &amp; aromatic pairing network</h1>
  <label>Find <input id="search" list="names" placeholder="e.g. Cumin" autocomplete="off"></label>
  <datalist id="names"></datalist>
  <label title="Pairs seen together in fewer recipes are hidden">Min. shared recipes
    <input id="minShared" type="number" min="1" max="200" step="1"></label>
  <button id="relayout">Re-run layout</button>
  <button id="reset">Clear selection</button>
  <span id="status" class="muted"></span>
</header>
<div id="cy"></div>
<aside id="panel"></aside>
<footer id="footer"></footer>

<script src="vendor/cytoscape.min.js"></script>
<script src="filters.js"></script>
<script src="data/pairings.js"></script>
<script src="app.js"></script>
</body>
</html>
